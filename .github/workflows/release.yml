# When a tag "vX.Y.Z" is pushed: builds the program for Windows and Linux and publishes a GitHub release with the installer, the portable
# zip, the AppImage, the Flatpak bundle and their checksums.
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# The version in CMakeLists.txt (project(... VERSION ...)), in resources/app.rc and in vcpkg.json should match the tag.
# NOTE: written without being able to run it (it only runs on GitHub); see ci.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Qt 6.7.3
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.7.3
          arch: win64_msvc2019_64
          modules: qtshadertools
          cache: true

      - name: Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP\vcpkg-cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\vcpkg-cache" | Out-Null

      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # builds, runs the tests, installs, and makes the zip, the installer and the checksums (tools/Build-Release.ps1)
      - name: Build everything
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $env:CMAKE_PREFIX_PATH = $env:QT_ROOT_DIR
          cmake --preset windows-release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          ./tools/Build-Release.ps1 -Preset windows-release -Version $version

      - name: Keep the Windows files
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/installer/ProjectFoxy-Setup-*.exe
            dist/ProjectFoxy-portable-*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build git curl zip unzip tar pkg-config autoconf automake libtool bison flex nasm \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libfreetype-dev libdbus-1-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-cursor0 libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev \
            libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev \
            libxcb-render-util0-dev libxcb-util-dev libxcb-xinerama0-dev libxcb-xkb-dev libwayland-dev \
            libgl1-mesa-dri xvfb

      - name: Qt 6.7.3
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.7.3
          arch: linux_gcc_64
          modules: qtshadertools
          cache: true

      - name: vcpkg
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"

      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Build
        run: |
          cmake --preset linux-release "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
          cmake --build --preset linux-release

      - name: Test
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --preset linux-release

      # Built on Ubuntu 22.04 (glibc 2.35): the AppImage runs on every distribution at least that recent.
      - name: AppImage
        run: QT_ROOT_DIR="$QT_ROOT_DIR" packaging/linux/build-appimage.sh

      - name: AppImage smoke test
        run: packaging/linux/smoke-appimage.sh dist/ProjectFoxy-*-x86_64.AppImage

      - name: Keep the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/ProjectFoxy-*-x86_64.AppImage
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ProjectFoxy.flatpak
          manifest-path: packaging/linux/flatpak/io.github.vulob1.ProjectFoxy.yml
          cache-key: flatpak-builder-${{ github.sha }}

  publish:
    needs: [windows, linux, flatpak]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      # The Flatpak bundle gets the version in its name like the other files; then one checksum file for everything.
      - name: Name the Flatpak bundle
        working-directory: files
        run: mv "$(ls *.flatpak | head -n1)" "ProjectFoxy-${GITHUB_REF_NAME#v}.flatpak"

      - name: Checksums
        working-directory: files
        run: sha256sum ProjectFoxy-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: Project Foxy ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            files/ProjectFoxy-*
            files/SHA256SUMS.txt
